<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Быстрый старт в Я.Трекере для аналитика</title>
<style>
:root {
  --ink:      #1B1B1A;
  --soft:     #5F6360;
  --faint:    #9A9E9B;
  --hair:     #DCDCDA;
  --orange:   #E8862A;
  --orange-d: #B9651A;
  --orange-s: #FDF3E9;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #fff;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1.0625rem;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

b { font-weight: 620; }

a { color: inherit; text-decoration: none; }
a:hover { color: var(--orange-d); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

/* ——— раскладка ——— */
.layout { display: grid; grid-template-columns: 17rem minmax(0, 1fr); align-items: start; }

.side {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  border-right: 1px solid var(--hair);
  padding: clamp(3rem, 8vw, 5rem) 1.5rem 3rem;
  font-size: 0.9875rem;
  line-height: 1.6;
}

.main { min-width: 0; }

.sheet {
  width: min(100% - 2.5rem, 720px);
  margin-inline: auto;
  padding-block: clamp(3rem, 8vw, 5rem) 4.5rem;
}

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: static;
    height: auto;
    border-right: 0;
    border-bottom: 1px solid var(--hair);
    padding: 2rem 1.25rem;
  }
}

/* ——— меню ——— */
.nav, .nav__sub { list-style: none; margin: 0; padding: 0; }
.nav > li { margin-bottom: 1rem; }
.nav > li:last-child { margin-bottom: 0; }
.nav a { display: block; }
.nav [aria-current="page"] { color: var(--orange-d); font-weight: 620; }

.nav__sub { counter-reset: s; margin-top: 0.5rem; }
.nav__sub li {
  counter-increment: s;
  display: grid;
  grid-template-columns: 1.75rem 1fr;
  gap: 0.5rem;
  align-items: baseline;
  margin-bottom: 0.5rem;
}
.nav__sub li:last-child { margin-bottom: 0; }
.nav__sub li::before { content: counter(s) "."; color: var(--faint); }

/* ——— типографика листа ——— */
.page-title {
  font-size: clamp(1.9rem, 5vw, 2.6rem);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin: 0 0 1.75rem;
  text-wrap: balance;
}

h2 {
  font-size: clamp(1.35rem, 3.4vw, 1.7rem);
  font-weight: 600;
  line-height: 1.3;
  display: grid;
  grid-template-columns: 1.75rem 1fr;
  gap: 0.75rem;
  align-items: baseline;
  text-wrap: balance;
  margin: 3rem 0 1.25rem;
  padding-top: 2rem;
  border-top: 1px solid var(--hair);
}
.page-title + h2 { margin-top: 0; padding-top: 0; border-top: 0; }

.num { font-size: 0.85em; font-weight: 700; color: var(--orange); }

p { margin: 0 0 1.1rem; }
p:last-child { margin-bottom: 0; }

.soft { color: var(--soft); }
.term { color: var(--orange-d); font-weight: 620; }
.meta { color: var(--soft); font-size: 0.9875rem; margin: 0 0 1.75rem; }

/* ——— призыв к действию ——— */
.cta {
  display: inline-block;
  margin: 1.75rem 0 0;
  padding: 0.35rem 1.1rem;
  border: 0;
  border-radius: 999px;
  background: var(--orange-s);
  color: var(--orange-d);
  font: inherit;
  font-weight: 620;
  line-height: 1.75;
  white-space: nowrap;
  cursor: pointer;
}
.cta:hover { background: #FBE9D6; }

/* ——— вопрос → ответ, замечание ——— */
.qa {
  display: grid;
  grid-template-columns: 1.75rem 1fr;
  gap: 0.5rem 0.75rem;
  align-items: baseline;
  margin: 1.75rem 0;
}
.qa__mark { color: var(--orange); font-weight: 700; }
.qa__q { margin: 0; font-weight: 620; }
.qa__a { margin: 0; }
.qa ul.plain { margin: 0; }

/* ——— списки ——— */
ul.plain { list-style: none; margin: 0 0 1.25rem; padding: 0; }
ul.plain li {
  display: grid;
  grid-template-columns: 1.25rem 1fr;
  gap: 0.5rem;
  align-items: baseline;
  margin-bottom: 0.5rem;
}
ul.plain li:last-child { margin-bottom: 0; }
ul.plain li::before { content: "—"; color: var(--orange); }

ol.plan { list-style: none; margin: 0; padding: 0; counter-reset: p; }
ol.plan li {
  counter-increment: p;
  display: grid;
  grid-template-columns: 1.75rem 1fr;
  gap: 0.75rem;
  align-items: baseline;
  margin-bottom: 1.1rem;
}
ol.plan li:last-child { margin-bottom: 0; }
ol.plan li::before { content: counter(p) "."; font-weight: 400; color: var(--ink); }
ol.plan b { display: block; font-weight: 400; }
ol.plan b.strong { font-weight: 620; }
ol.plan .desc {
  display: block;
  color: var(--soft);
  font-size: 0.9875rem;
  line-height: 1.6;
}
ol.plan a { display: block; }
ol.plan a:hover b { color: var(--orange-d); }

.badge {
  display: inline-block;
  vertical-align: baseline;
  margin-left: 0.5rem;
  padding: 0.05rem 0.55rem;
  border-radius: 999px;
  background: var(--orange-s);
  color: var(--orange-d);
  font-size: 0.8125rem;
  line-height: 1.5;
  white-space: nowrap;
}

/* ——— таблица: только волосяные линии строк ——— */
.tbl { overflow-x: auto; margin: 0 0 1.5rem; }
table { border-collapse: collapse; width: 100%; font-size: 0.9875rem; line-height: 1.6; }
th, td { text-align: left; padding: 0.6rem 1rem 0.6rem 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
th { font-weight: 620; color: var(--soft); }
td:last-child, th:last-child { padding-right: 0; }

/* ——— иллюстрации ——— */
figure { margin: 1rem 0 1.2rem; text-align: center; }
figure img { display: block; width: 100%; max-width: 23rem; height: auto; margin-inline: auto; }
figcaption { font-size: 0.8125rem; color: var(--faint); margin-top: 0.35rem; }
figcaption a { color: inherit; text-underline-offset: 0.2em; text-decoration: underline; }
figcaption a:hover { color: var(--orange-d); }

/* ——— схематичный макет интерфейса ——— */
.ui { border: 1px solid var(--hair); padding: 0.9rem 1rem; text-align: left; line-height: 1.6; }
.ui__row { display: grid; grid-template-columns: 8.5rem 1fr; gap: 1rem; }
.ui__rail { border-right: 1px solid var(--hair); padding-right: 1rem; color: var(--soft); }
.ui__rail p { margin: 0 0 0.3rem; }
.ui__line { border-bottom: 1px solid var(--hair); padding: 0.35rem 0; color: var(--soft); }
.ui__line:last-child { border-bottom: 0; }
.ui__line b { color: var(--ink); font-weight: 400; }
.ui__cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.ui__col p { margin: 0 0 0.4rem; }
.ui__col .h { color: var(--soft); border-bottom: 1px solid var(--hair); padding-bottom: 0.3rem; }
.mark { color: var(--orange); font-weight: 700; }

@media (max-width: 620px) {
  .ui__row, .ui__cols { grid-template-columns: 1fr; }
  .ui__rail { border-right: 0; border-bottom: 1px solid var(--hair); padding: 0 0 0.75rem; }
}

ol.callouts { list-style: none; margin: 0.75rem 0 0; padding: 0; counter-reset: c; text-align: left; }
ol.callouts li {
  counter-increment: c;
  display: grid;
  grid-template-columns: 1.25rem 1fr;
  gap: 0.5rem;
  align-items: baseline;
  margin-bottom: 0.5rem;
  font-size: 0.9875rem;
  line-height: 1.6;
}
ol.callouts li::before { content: counter(c); color: var(--orange); font-weight: 700; }

.foot { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--hair); color: var(--soft); font-size: 0.9875rem; }
.foot a { color: var(--orange-d); }

@media print {
  .layout { display: block; }
  .side, .cta { display: none; }
  .sheet { width: 100%; padding: 0; }
}
</style>
</head>
<body>

<div class="layout">
  <nav class="side" aria-label="Разделы тестового задания">
    <ul class="nav" id="nav"></ul>
  </nav>
  <div class="main">
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ARTICLES = [
    { id: "intro",  title: "Знакомство с Яндекс.Трекером", time: "3 мин",
      desc: "Что такое очередь, задача, статус" },
    { id: "create", title: "Создание задачи и основные приёмы работы с ней", time: "6 мин",
      desc: "Понятное название, критерии готовности, чеклист", full: true },
    { id: "search", title: "Поиск и организация работы", time: "4 мин",
      desc: "Поиск задач, фильтры, списки и доски" },
    { id: "extra",  title: "Дополнительные возможности", time: "2 мин",
      desc: "Шаблоны, автоматизация, расширенные настройки" }
  ];

  var sheet = document.getElementById("sheet");
  var nav   = document.getElementById("nav");

  /* ------------------------------------------------------------- меню */
  function buildNav() {
    var sub = ARTICLES.map(function (a) {
      return '<li><a href="#' + a.id + '" data-go="' + a.id + '">' + a.title +
             (a.full ? '<span class="badge">подробная статья</span>' : '') + '</a></li>';
    }).join("");

    nav.innerHTML =
      '<li><a href="#analysis" data-go="analysis">Анализ задачи и проектирование решения</a></li>' +
      '<li><a href="#" data-go="home">Быстрый старт в Я.Трекере для аналитика</a>' +
      '<ol class="nav__sub">' + sub + '</ol></li>';
  }

  function markNav(id) {
    Array.prototype.forEach.call(nav.querySelectorAll("a"), function (a) {
      if (a.dataset.go === id) { a.setAttribute("aria-current", "page"); }
      else { a.removeAttribute("aria-current"); }
    });
  }

  /* ---------------------------------------------------------- главная */
  function home() {
    var items = ARTICLES.map(function (a) {
      return '<li><a href="#' + a.id + '" data-go="' + a.id + '">' +
             '<b' + (a.full ? ' class="strong"' : '') + '>' + a.title +
             (a.full ? '<span class="badge">подробная статья</span>' : '') + '</b>' +
             '<span class="desc">' + a.time + ' · ' + a.desc + '</span>' +
             '</a></li>';
    }).join("");

    return '<h1 class="page-title">Быстрый старт в Я.Трекере для аналитика</h1>' +
      '<p><b>Пятнадцать минут — и первая задача поставлена.</b></p>' +
      '<button type="button" class="cta" data-go="intro">Начать чтение</button>' +
      '<h2><span class="num">1</span><span>Статьи раздела</span></h2>' +
      '<ol class="plan">' + items + '</ol>' +
      '<p class="foot">Нужно настроить права или интеграции? ' +
      '<a href="https://yandex.ru/support/tracker/">Перейти к полной справке Трекера</a></p>';
  }

  /* ------------------------------------------------------ анализ задачи */
  function analysis() {
    return [
      '<h1 class="page-title">Анализ задачи и проектирование решения</h1>',

      '<h2><span class="num">1</span><span>Подход к выполнению задания</span></h2>',
      '<p>При проектировании стартового раздела рассматривались два принципа организации материала:</p>',
      '<ul class="plain">',
      '<li><span><b class="term">Функциональный подход</b>: построение документации вокруг возможностей ',
      'системы — очередей, задач, статусов и других функций</span></li>',
      '<li><span><b class="term">Сценарный подход</b>: по рабочим сценариям пользователя — обучение ',
      'через выполнение типовых рабочих задач</span></li>',
      '</ul>',
      '<p>Для стартового раздела выбран <b>комбинированный подход</b>: в основу положен ключевой ',
      'рабочий сценарий пользователя, а остальные статьи раскрывают функциональность, ',
      'необходимую для его выполнения.</p>',

      '<h2><span class="num">2</span><span>Изучение целевой аудитории</span></h2>',
      '<p>Для изучения целевой аудитории был проанализирован типовой рабочий процесс ',
      'бизнес-аналитика. В общих чертах круг его задач выглядит так:</p>',
      '<figure>',
      '<img src="biznes-analitik-768x768.png" alt="Схема: в центре бизнес-аналитик, вокруг восемь ',
      'обязанностей — найти новую проблему, провести анализ, предложить решение руководству и ',
      'согласовать, написать требования продукта, дать задачу разработчикам и дизайнерам, ',
      'контролировать сроки и качество, исправить косяки, предложить бизнесу готовое решение">',
      '<figcaption>Иллюстрация — <a href="https://kinzhal.media/business-analyst/">Кинжал</a></figcaption>',
      '</figure>',
      '<p>По результатам анализа были сформулированы два ключевых вопроса, определяющих ',
      'содержание стартового раздела.</p>',
      '<div class="qa">',
      '<span class="qa__mark" aria-hidden="true">?</span>',
      '<p class="qa__q">Зачем бизнес-аналитику Я.Трекер?</p>',
      '<span class="qa__mark" aria-hidden="true">→</span>',
      '<p class="qa__a">Оформить и сопровождать требование заказчика в виде задачи.</p>',
      '</div>',
      '<div class="qa">',
      '<span class="qa__mark" aria-hidden="true">?</span>',
      '<p class="qa__q">Какой функционал Я.Трекера необходим для решения этой задачи?</p>',
      '<span class="qa__mark" aria-hidden="true">→</span>',
      '<ul class="plain">',
      '<li><span>работа с очередью проекта;</span></li>',
      '<li><span>создание и описание задачи;</span></li>',
      '<li><span>назначение исполнителя и управление участниками;</span></li>',
      '<li><span>отслеживание выполнения задачи.</span></li>',
      '</ul>',
      '</div>',
      '<p>Ответ на второй вопрос лёг в основу структуры стартового раздела.</p>',

      '<h2><span class="num">3</span><span>Структура стартового раздела</span></h2>',
      '<ol class="plan">',
      ARTICLES.map(function (a) {
        return '<li><span><b' + (a.full ? ' class="strong"' : '') + '>' + a.title +
               (a.full ? '<span class="badge">подробная статья</span>' : '') + '</b>' +
               '<span class="desc">' + a.desc + '</span></span></li>';
      }).join(""),
      '</ol>'
    ].join("");
  }

  /* ---------------------------------------------------- полная статья */
  function full() {
    return [
      '<h1 class="page-title">Создание задачи и основные приёмы работы с ней</h1>',
      '<p class="meta">6 минут · Нужен доступ в Я.Трекер и название очереди команды</p>',

      '<p>Задача — основная единица работы в Я.Трекере. Всё, что происходит по проекту, ',
      'происходит внутри задач: в них ставят работу, обсуждают решения и фиксируют результат. ',
      'Статья показывает, как создать задачу, пригодную к исполнению, и что делать с ней дальше.</p>',

      '<h2><span class="num">1</span><span>Термины</span></h2>',
      '<ul class="plain">',
      '<li><span><b>Очередь</b> — рабочее пространство команды. Каждая задача принадлежит одной очереди; задач вне очереди не бывает.</span></li>',
      '<li><span><b>Ключ задачи</b> — постоянный идентификатор вида ANL-14: код очереди и порядковый номер. Служит адресом задачи в переписке и документах.</span></li>',
      '<li><span><b>Статус</b> — положение задачи в рабочем процессе. Адресован команде, а не автору: по нему коллеги понимают, чего от задачи ждать.</span></li>',
      '<li><span><b>Исполнитель</b> — сотрудник, отвечающий за выполнение. У задачи он один.</span></li>',
      '<li><span><b>Наблюдатель</b> — сотрудник, получающий уведомления об изменениях, но не отвечающий за задачу.</span></li>',
      '</ul>',

      '<h2><span class="num">2</span><span>Откройте форму создания задачи</span></h2>',
      '<p>Кнопка <b>Создать задачу</b> находится в левом меню и доступна с любой страницы — ',
      'возвращаться на главную не нужно.</p>',
      '<figure>',
      '<div class="ui"><div class="ui__row">',
      '<div class="ui__rail">',
      '<p><span class="mark">1</span> Создать задачу</p>',
      '<p>Задачи</p><p><span class="mark">2</span> Очереди</p><p>Доски задач</p><p>Дашборды</p>',
      '</div>',
      '<div>',
      '<div class="ui__line">ANL · Аналитика</div>',
      '<div class="ui__line"><b>ANL-11</b> Собрать требования к отчёту по продажам</div>',
      '<div class="ui__line"><b>ANL-12</b> Согласовать ТЗ на интеграцию с учётной системой</div>',
      '</div>',
      '</div></div>',
      '<figcaption>Схема: левое меню и список задач очереди</figcaption>',
      '<ol class="callouts">',
      '<li>Кнопка <b>Создать задачу</b> — в самом верху левого меню, над списком разделов.</li>',
      '<li>Раздел <b>Очереди</b> — выбор рабочего пространства команды. Ниже: «Задачи», «Доски задач», «Дашборды».</li>',
      '</ol>',
      '</figure>',
      '<div class="qa"><span class="qa__mark" aria-hidden="true">!</span>',
      '<p class="qa__a">Если очередь команды уже открыта, задача создаётся прямо из неё — ',
      'очередь подставится в форму автоматически.</p></div>',

      '<h2><span class="num">3</span><span>Проверьте очередь</span></h2>',
      '<p>В верхней части формы указана очередь, в которой будет создана задача. ',
      'Если подставилась не та — смените её здесь же, до создания.</p>',
      '<div class="qa"><span class="qa__mark" aria-hidden="true">!</span>',
      '<p class="qa__a">Ключ задачи формируется из кода очереди и после создания не меняется. ',
      'Перенести задачу в другую очередь можно, но она получит новый ключ, а ссылки со старым ',
      'перестанут её открывать.</p></div>',

      '<h2><span class="num">4</span><span>Сформулируйте название</span></h2>',
      '<p>Название читают в списках, где не видно ни описания, ни комментариев. ',
      'Оно должно отвечать на один вопрос: <b>что должно быть сделано</b>.</p>',
      '<div class="tbl"><table>',
      '<thead><tr><th>Так не работает</th><th>Так работает</th><th>Почему</th></tr></thead>',
      '<tbody>',
      '<tr><td>Вопрос по отчёту</td><td>Согласовать состав полей отчёта по продажам</td><td>Видно требуемое действие и предмет</td></tr>',
      '<tr><td>Коллеги, нужно посмотреть выгрузку</td><td>Проверить выгрузку остатков за июль на дубли</td><td>Задача — не письмо</td></tr>',
      '<tr><td>Личный кабинет</td><td>Описать сценарий восстановления пароля</td><td>Одно существительное не отличает задачу от соседних</td></tr>',
      '</tbody></table></div>',
      '<p>Правило: если название начинается с глагола в неопределённой форме — «Описать», ',
      '«Согласовать», «Проверить», — оно почти наверняка сформулировано верно.</p>',

      '<h2><span class="num">5</span><span>Заполните описание и параметры</span></h2>',
      '<p>Описание отвечает на вопросы, которые исполнитель задал бы в переписке. Достаточно трёх блоков: ',
      '<b>контекст</b> — откуда взялась задача; <b>что сделать</b> — существо требования; ',
      '<b>критерии готовности</b> — по какому признаку задачу можно закрыть.</p>',
      '<p>Полный текст требований в описание не переносят: он живёт в документе, ',
      'а в задаче остаётся ссылка на него.</p>',
      '<figure>',
      '<div class="ui">',
      '<div class="ui__line"><span class="mark">1</span> ANL · Аналитика</div>',
      '<div class="ui__line"><span class="mark">2</span> Описать сценарий восстановления пароля</div>',
      '<div class="ui__line"><span class="mark">3</span> Контекст: 40 обращений в поддержку в месяц. Что сделать: описать шаги восстановления. Критерии готовности: сценарий согласован с безопасностью.</div>',
      '<div class="ui__line"><span class="mark">4</span> Тип: Задача · Приоритет: Средний · Дедлайн: 22.09.2026</div>',
      '<div class="ui__line"><span class="mark">5</span> Исполнитель: Н. Соколова · Наблюдатели: 2 человека</div>',
      '<div class="ui__line"><span class="mark">6</span> Создать задачу</div>',
      '</div>',
      '<figcaption>Схема: состав формы создания задачи</figcaption>',
      '<ol class="callouts">',
      '<li>Очередь в верхней части формы; здесь же меняется.</li>',
      '<li>Название задачи — верхнее поле, обязательное.</li>',
      '<li>Описание — большое поле под названием, с форматированием и ссылками.</li>',
      '<li>Панель параметров справа: тип, приоритет, дата начала, дедлайн.</li>',
      '<li>Исполнитель и наблюдатели — поля с поиском по сотрудникам.</li>',
      '<li>Кнопка «Создать задачу» — слева внизу формы, рядом «Отменить».</li>',
      '</ol>',
      '</figure>',
      '<p>Из всей панели в первый день нужны четыре поля.</p>',
      '<div class="tbl"><table>',
      '<thead><tr><th>Поле</th><th>Что означает</th><th>Заполнять</th></tr></thead>',
      '<tbody>',
      '<tr><td>Тип</td><td>Характер работы: задача, ошибка, улучшение</td><td>Если в очереди несколько типов</td></tr>',
      '<tr><td>Приоритет</td><td>Очерёдность относительно других задач</td><td>Если отличается от среднего</td></tr>',
      '<tr><td>Дедлайн</td><td>Дата завершения работы</td><td>Если срок реально существует</td></tr>',
      '<tr><td>Исполнитель</td><td>Тот, кто отвечает за выполнение</td><td>Всегда</td></tr>',
      '</tbody></table></div>',
      '<div class="qa"><span class="qa__mark" aria-hidden="true">!</span>',
      '<p class="qa__a">Дедлайн, поставленный «на всякий случай», через месяц делает просроченной ',
      'половину очереди — и поле перестаёт что-либо значить для команды.</p></div>',

      '<h2><span class="num">6</span><span>Создайте задачу</span></h2>',
      '<p>Нажмите <b>Создать задачу</b>. Задача получит постоянный ключ вида ANL-14 и начальный ',
      'статус рабочего процесса, исполнитель и наблюдатели получат уведомление, ',
      'откроется карточка задачи.</p>',

      '<h2><span class="num">7</span><span>Основные приёмы работы</span></h2>',
      '<ul class="plain">',
      '<li><span><b class="term">Смена статуса.</b> Переключается в правой части карточки. Набор статусов задаёт рабочий процесс очереди: <span class="mark">Открыт → В работе → Закрыт</span>. Произвольные значения ввести нельзя — команда видит одинаковую картину.</span></li>',
      '<li><span><b class="term">Комментарий и призыв.</b> Обсуждение ведут в задаче, а не в мессенджере: через полгода никто не вспомнит, почему требование изменили. Чтобы привлечь коллегу, упомяните его через «собаку» — он получит уведомление и станет наблюдателем.</span></li>',
      '<li><span><b class="term">Чеклист.</b> Если задача состоит из нескольких шагов, но дробить её избыточно — добавьте список пунктов с галочками. Прогресс виден в карточке.</span></li>',
      '<li><span><b class="term">Связи между задачами.</b> Работа аналитика зависима: требование ждёт решения архитектора, согласование — ответа заказчика. Ставьте связь «блокируется» вместо того, чтобы держать ожидание в переписке.</span></li>',
      '</ul>',
      '<figure>',
      '<div class="ui"><div class="ui__cols">',
      '<div class="ui__col"><p class="h">Открыт · 2</p><p>ANL-14 Описать сценарий восстановления пароля</p><p>ANL-15 Актуализировать глоссарий</p></div>',
      '<div class="ui__col"><p class="h">В работе · 1</p><p>ANL-12 Согласовать ТЗ на интеграцию</p></div>',

      '</div></div>',
      '<figcaption>Схема: та же очередь в режиме доски — колонки соответствуют статусам</figcaption>',
      '</figure>',

      '<h2><span class="num">8</span><span>Типичные ошибки</span></h2>',
      '<div class="tbl"><table>',
      '<thead><tr><th>Ошибка</th><th>Чем оборачивается</th><th>Как правильно</th></tr></thead>',
      '<tbody>',
      '<tr><td>Задача написана как письмо</td><td>Исполнитель вычитывает три абзаца ради одного действия</td><td>Название — глагол и результат</td></tr>',
      '<tr><td>Исполнитель не назначен</td><td>Задача не попадает ни в чей список</td><td>Назначать сразу, хотя бы руководителя направления</td></tr>',
      '<tr><td>Обсуждение ушло в мессенджер</td><td>Решение принято, обоснование потеряно</td><td>Итог переносить в комментарий задачи</td></tr>',
      '<tr><td>Задача заведена повторно</td><td>Две задачи об одном, у каждой свой кусок истории</td><td>Перед созданием искать по ключевому слову</td></tr>',
      '<tr><td>Статус не меняется неделями</td><td>Команда считает работу незапущенной</td><td>Переводить в «В работе» в день начала</td></tr>',
      '</tbody></table></div>'
    ].join("");
  }

  /* -------------------------------------------------------- заглушка */
  function stub(a, i) {
    return '<h1 class="page-title">' + a.title + '</h1>' +
      '<p class="meta">' + a.time + ' · Статья ' + (i + 1) + ' из ' + ARTICLES.length + '</p>' +
      '<p>' + a.desc + '.</p>' +
      '<p class="soft">Текст статьи в подготовке. В прототипе полностью написана статья ' +
      '<a href="#create" data-go="create"><b>«Создание задачи и основные приёмы работы с ней»</b></a>.</p>';
  }

  /* ------------------------------------------------------------ показ */
  function render(id) {
    if (id === "analysis") {
      sheet.innerHTML = analysis();
      document.title = "Анализ задачи и проектирование решения";
    } else if (id === "home") {
      sheet.innerHTML = home();
      document.title = "Быстрый старт в Я.Трекере для аналитика";
    } else {
      var i = 0;
      ARTICLES.forEach(function (a, n) { if (a.id === id) { i = n; } });
      var a = ARTICLES[i];
      sheet.innerHTML = a.full ? full() : stub(a, i);
      document.title = a.title + " · Быстрый старт в Я.Трекере";
    }
    markNav(id);
    window.scrollTo(0, 0);
  }

  document.addEventListener("click", function (e) {
    var go = e.target.closest("[data-go]");
    if (!go) { return; }
    e.preventDefault();
    var id = go.dataset.go;
    history.replaceState(null, "", id === "home" ? "#" : "#" + id);
    render(id);
  });

  buildNav();

  var hash = window.location.hash.replace("#", "");
  var known = hash === "analysis" || ARTICLES.some(function (a) { return a.id === hash; });
  render(known ? hash : "home");
})();
</script>

</body>
</html>
